server:
  port: 8080

spring:
  application:
    name: smart-parking-backend
  datasource:
    url: jdbc:h2:mem:parking_system_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: SmartParkingLocalHikariCP
      maximum-pool-size: 15
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-local.sql
      data-locations: classpath:data-local.sql
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

smartparking:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app,https://*.onrender.com

logging:
  level:
    root: INFO
    com.smartparking: INFO
    org.springframework.jdbc: INFO
